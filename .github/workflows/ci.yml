name: build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:   # 매일 05:30 KST — joyhouse(06:00)·myblog(07:00) 동기화보다 먼저 새 여행 글을 여정에 붙인다
    - cron: "30 20 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # data/private.json 은 저장소에 없다. 그래서 CI는 공개 표기만으로 빌드한다.
      # 구글 지도 키 — 저장소 비밀에 GOOGLE_MAPS_KEY 가 있을 때만 들어간다(없으면 번들 지도).
      # 그 키에는 반드시 HTTP 리퍼러 제한을 걸어 둔다(README '구글 지도').
      # 블로그 RSS의 새 여행 글 → data/trips.json (규칙만 · LLM 없음). 바뀌면 data/ 를 커밋한다.
      - name: 블로그 여행 글 동기화
        if: github.event_name != 'pull_request'
        run: |
          python scripts/sync_blog_trips.py || echo "RSS 실패 — 지난 데이터로 빌드"
          python scripts/build_places.py
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data && git commit -m "블로그 여행 글 자동 반영" && git push
          fi

      - name: 빌드
        run: python scripts/build_all.py --public
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}

      - name: 테스트
        run: python -m unittest discover -s tests -v
        env:   # 키를 넣은 빌드에서는 '공개본에 키 없음' 시험을 건너뛴다
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}

      # GitHub Pages 는 공개다. 실명이 빠진 공개 빌드만 올린다(PRD §11).
      # 일정표는 저장소의 data/trip_html/ 에 있는 공개본뿐이다.
      # 개인 일정표(data/trip_html/private/)는 .gitignore 라 CI에 아예 없다(PRD §11).
      - name: Pages 자료 준비
        run: |
          mkdir -p _site
          cp app/index.public.html _site/index.html
          mkdir -p _site/data && cp app/data/app.public.json _site/data/
          # 형제 사이트(joyhouse 맵룸)가 같은 키로 구글 지도를 띄우도록 키만 따로 내놓는다.
          # 키는 리퍼러 제한(holyjoekang.github.io)이 걸린 브라우저 키라 공개본에 이미 들어 있는 것이다.
          python -c "import json; k=json.load(open('app/data/app.public.json',encoding='utf-8')).get('mapsKey',''); json.dump({'googleMapsKey':k},open('_site/maps.json','w'))"
          if [ -d app/art ]; then cp -r app/art _site/art; fi
          cp app/story.html _site/story.html && cp -r app/stories _site/stories
          if [ -d app/itinerary ]; then cp -r app/itinerary _site/itinerary; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            app/index.public.html
            app/data/app.public.json
            app/art

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
