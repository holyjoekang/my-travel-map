<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 여행 지도</title>
<meta name="description" content="1996년부터 30년, 출장과 주재와 여행으로 지나온 도시들의 기록.">
<meta name="referrer" content="no-referrer">
<style>
:root{
  --bg:#f7f5f0; --panel:#fffdf8; --line:#e2dcd0; --ink:#1f1c17; --dim:#7b7264;
  --accent:#9a6a3a; --accent-ink:#fff8ee;
  --shadow:0 1px 2px rgba(31,28,23,.06),0 10px 30px rgba(31,28,23,.07);
  --lift:0 4px 10px rgba(31,28,23,.09),0 20px 44px rgba(31,28,23,.11);
  --sea:#e8eef3; --land:#ded7c8; --landline:#c9c0ad;
  --ph1:#cbb79c; --ph2:#9a8f7c;
  --business:#2563eb; --expat:#7c3aed; --family:#059669; --couple:#db2777;
  --friends:#d97706; --pilgrimage:#0891b2; --solo:#64748b;
  --serif:Georgia,"Noto Serif KR","Apple SD Gothic Neo",serif;
  --sans:-apple-system,"Segoe UI","Noto Sans KR",sans-serif;
  --head:57px;
  /* 홈 표지의 색. 콜라주 원화에서 그대로 뽑았다. */
  --paper:#fbf6ee; --navy:#003261;
  --hero-bg:linear-gradient(180deg,#e7eff6 0%,#fbf6ee 66%);
  --hero-ink:#003261; --hero-sub:#4c5d6e; --hero-btn-ink:#fbf6ee;
  --hero-ghost:rgba(255,255,255,.55); --hero-ghost-on:rgba(255,255,255,.88);
  --art-op:1; --art-filter:none;
  /* 홈 표지의 지구본. 바다는 표지 글자의 남색, 땅은 종이색 — 콜라주와 같은 두 색이다. */
  --globe-sea:#002a52; --globe-sea-hi:#0d4a80; --globe-land:#f4ecdc; --globe-coast:#c9b99a;
  --globe-grid:rgba(251,246,238,.09); --globe-pt:#e2861a; --globe-pt-ring:#6b3000;
  --globe-halo:#f59e0b; --globe-atm:#8fc0ea; --globe-home:#003261; --globe-arc:#c2410c;
  --glass:rgba(251,246,238,.94);
  /* 홈 장식 그림(--art-*)은 scripts/build_app.py 가 여기에 박는다. */
  /*__ART__*/
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1b1913; --navy:#cfe0f0;
  --hero-bg:linear-gradient(180deg,#131a21 0%,#1b1913 66%);
  --hero-ink:#e9eff6; --hero-sub:#9eb0c1; --hero-btn-ink:#10161c;
  --hero-ghost:rgba(233,239,246,.07); --hero-ghost-on:rgba(233,239,246,.16);
  --art-op:.52; --art-filter:saturate(.75) brightness(.82);
  --globe-sea:#07121d; --globe-sea-hi:#15304a; --globe-land:#2b3a49; --globe-coast:#3c5064;
  --globe-grid:rgba(233,239,246,.05); --globe-pt:#f7c46a; --globe-pt-ring:#07121d;
  --globe-halo:#ffcf7a; --globe-atm:#4f86b8; --globe-home:#e9eff6; --globe-arc:#fb923c;
  --glass:rgba(22,21,15,.88);
  --bg:#16150f; --panel:#201e17; --line:#38342a; --ink:#ece7dc; --dim:#9a9184;
  --accent:#d8b478; --accent-ink:#1b1810; --sea:#12171c; --land:#2f2c24; --landline:#45402f;
  --ph1:#3a3529; --ph2:#22201a;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  --lift:0 6px 14px rgba(0,0,0,.5),0 22px 48px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --paper:#1b1913; --navy:#cfe0f0;
  --hero-bg:linear-gradient(180deg,#131a21 0%,#1b1913 66%);
  --hero-ink:#e9eff6; --hero-sub:#9eb0c1; --hero-btn-ink:#10161c;
  --hero-ghost:rgba(233,239,246,.07); --hero-ghost-on:rgba(233,239,246,.16);
  --art-op:.52; --art-filter:saturate(.75) brightness(.82);
  --globe-sea:#07121d; --globe-sea-hi:#15304a; --globe-land:#2b3a49; --globe-coast:#3c5064;
  --globe-grid:rgba(233,239,246,.05); --globe-pt:#f7c46a; --globe-pt-ring:#07121d;
  --globe-halo:#ffcf7a; --globe-atm:#4f86b8; --globe-home:#e9eff6; --globe-arc:#fb923c;
  --glass:rgba(22,21,15,.88);
  --bg:#16150f; --panel:#201e17; --line:#38342a; --ink:#ece7dc; --dim:#9a9184;
  --accent:#d8b478; --accent-ink:#1b1810; --sea:#12171c; --land:#2f2c24; --landline:#45402f;
  --ph1:#3a3529; --ph2:#22201a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}
img{display:block}

/* ── 상단 ── */
header.site{display:flex;align-items:center;gap:12px;padding:10px 20px;height:var(--head);
  border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:baseline;gap:9px;cursor:pointer;padding:0}
.brand b{font:600 17px/1.2 var(--serif);letter-spacing:0;white-space:nowrap}
.brand span{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none}
.tabs button{padding:6px 12px;border-radius:999px;font-size:13.5px;color:var(--dim)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
#search{flex:none;padding:7px 12px;border:1px solid var(--line);border-radius:999px;
  background:var(--bg);color:var(--ink);width:160px;font-size:16px}
.cta-btn{padding:7px 15px;border-radius:999px;background:var(--accent);color:var(--accent-ink);
  font-size:13.5px;font-weight:600;white-space:nowrap}
.cta-btn:hover{filter:brightness(1.07)}
#menuBtn{display:none;font-size:20px;padding:4px 8px}

/* ── 앱 레이아웃 ── */
.wrap{display:grid;grid-template-columns:212px 1fr;min-height:calc(100vh - var(--head))}
.wrap.full{grid-template-columns:1fr}
.wrap.full aside{display:none}
aside{border-right:1px solid var(--line);padding:16px;background:var(--panel)}
aside h3{font-size:11px;letter-spacing:.09em;color:var(--dim);
  text-transform:uppercase;margin:18px 0 8px}
aside h3:first-child{margin-top:0}
.chip{display:block;width:100%;text-align:left;padding:5px 9px;border-radius:7px;
  font-size:13px;color:var(--dim)}
.chip:hover{background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600}
.chip .n{float:right;font-variant-numeric:tabular-nums;font-size:11px;opacity:.7}
.legend{display:flex;align-items:center;gap:7px;padding:3px 9px;font-size:12.5px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
main{padding:16px;min-width:0}
main.home{padding:0}

/* ── 홈: 표지 ──
   data/design_pics 의 콜라주 한 장을 조각내 양 옆에 세우고, 글자는 살려 둔다.
   그림은 장식이라 좁은 화면에서는 접는다. */
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--hero-bg)}
.hero::before,.hero::after{content:"";position:absolute;top:0;bottom:0;z-index:0;
  background-repeat:no-repeat;pointer-events:none;
  opacity:var(--art-op);filter:var(--art-filter)}
.hero::before{left:0;width:min(31%,352px);background-image:var(--art-hero-left);
  background-size:cover;background-position:right bottom;
  -webkit-mask-image:linear-gradient(90deg,#000 58%,transparent);
  mask-image:linear-gradient(90deg,#000 58%,transparent)}
.hero::after{right:0;width:min(22%,244px);background-image:var(--art-hero-right);
  background-size:cover;background-position:left center;
  -webkit-mask-image:linear-gradient(270deg,#000 54%,transparent);
  mask-image:linear-gradient(270deg,#000 54%,transparent)}
.hero .inner{position:relative;z-index:1;max-width:680px;margin:0 auto;
  padding:58px 24px 46px;text-align:center;color:var(--hero-ink)}
.hero .kicker{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--hero-sub);font-weight:700}
.hero h2{font:600 clamp(29px,4.6vw,50px)/1.16 var(--serif);margin:12px 0 0;
  color:var(--hero-ink);letter-spacing:-.02em;
  /* 두 줄로 갈릴 때 '여정' 한 낱말만 떨어지지 않게 한다. */
  text-wrap:balance;word-break:keep-all}
.hero p{margin:14px auto 0;font-size:clamp(13.5px,1.5vw,16px);max-width:46ch;
  color:var(--hero-sub);word-break:keep-all}
.hero .acts{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.hero .solid,.hero .ghost{display:inline-flex;align-items:center;gap:8px;
  padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600}
.hero .solid{background:var(--hero-ink);color:var(--hero-btn-ink);
  box-shadow:0 6px 18px rgba(0,50,97,.22)}
.hero .solid:hover{filter:brightness(1.12)}
.hero .ghost{border:1.5px solid var(--hero-ink);color:var(--hero-ink);
  background:var(--hero-ghost)}
.hero .ghost:hover{background:var(--hero-ghost-on)}
.hero svg{width:17px;height:17px;flex:none}
.torn{height:22px;margin-top:-22px;position:relative;z-index:2;
  background:var(--art-torn) center bottom/100% 100% no-repeat;
  opacity:var(--art-op);filter:var(--art-filter)}
@media (max-width:900px){
  .hero::before,.hero::after{display:none}
  .hero .inner{padding:40px 18px 34px}
  .torn{display:none}
}

/* ── 홈 표지: 지구본 ──
   다녀온 도시를 지구본에 점으로 켠다. 먼저 번들의 국경선으로 그린 정지 지구본(SVG)이
   서고, three.js 를 받으면 그 위에 돌아가는 지구본이 겹쳐 뜬다. 못 받으면 정지 그림이
   그대로 표지를 맡는다 — 3D 투어와 같은 규칙이다(PRD §18·§19).
   넓은 화면: 글은 왼쪽, 지구본은 오른쪽 아래로 크게 걸쳐 잘린다.
   좁은 화면: 지구본이 위, 글이 아래. */
.hero.globe{--hh:clamp(560px,calc(100svh - var(--head) - 150px),800px);height:var(--hh)}
.hero.globe::before,.hero.globe::after{display:none}
.hero.globe .inner{position:relative;z-index:2;margin:0;max-width:700px;text-align:left;
  padding:clamp(28px,9vh,112px) 24px 44px clamp(24px,6.5vw,96px);pointer-events:none}
.hero.globe .inner>*{pointer-events:auto}
.hero.globe h2{font-size:clamp(32px,4vw,58px);max-width:11em}
.hero.globe p{margin-left:0}
.hero.globe .acts{justify-content:flex-start}
.gbox{position:absolute;z-index:1;top:-5%;width:calc(var(--hh)*1.4);height:calc(var(--hh)*1.4);
  left:calc(max(78%, 640px + var(--hh)*.625) - var(--hh)*.7)}
.gstage{position:relative;width:100%;height:100%;touch-action:pan-y;cursor:grab;outline:0}
.gstage:active{cursor:grabbing}
.gstage:focus-visible{outline:2px solid var(--accent);outline-offset:-40px;border-radius:50%}
.gstage svg,.gstage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gstage canvas{opacity:0;transition:opacity .6s}
.hero.glOn .gstage canvas{opacity:1}
.hero.glOn .gsvg{opacity:0;pointer-events:none;transition:opacity .4s .5s}
.gsvg .sea{fill:url(#gSea)}
.gsvg .grid{fill:none;stroke:var(--globe-grid);stroke-width:1}
.gsvg .land{fill:var(--globe-land);stroke:var(--globe-coast);stroke-width:.7;stroke-linejoin:round}
.gsvg .gpt{fill:var(--globe-pt);stroke:var(--globe-pt-ring);stroke-opacity:.75;stroke-width:1.1;cursor:pointer}
.gsvg .home{fill:none;stroke:var(--globe-home);stroke-width:2.6}
.gsvg .garc{fill:none;stroke:var(--globe-arc);stroke-width:3;stroke-dasharray:8 6;stroke-linecap:round}
.gsvg .off{display:none}
.gtip{position:absolute;z-index:3;width:214px;box-sizing:border-box;padding:12px 15px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);box-shadow:var(--lift);color:var(--ink);
  pointer-events:none;transform:translate(20px,-50%)}
.gtip.flip{transform:translate(calc(-100% - 20px),-50%)}
.gtip b{display:block;font:700 19px/1.3 var(--serif)}
.gtip span{display:block;font-size:12.5px;color:var(--dim)}
.gtip i{display:block;margin-top:6px;font-style:normal;font-size:12.5px;font-weight:700;color:var(--accent)}
.gnote{position:absolute;z-index:2;right:clamp(16px,3vw,40px);bottom:24px;display:flex;gap:10px;
  align-items:center;flex-wrap:wrap;justify-content:flex-end}
.gchip,.glegend{display:inline-flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;
  background:var(--glass);border:1px solid var(--line);font-size:12.5px;color:var(--ink);text-align:left}
.gchip{box-shadow:var(--shadow);line-height:1.35}
.gchip:hover{border-color:var(--globe-arc)}
.gchip small{display:block;font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--globe-arc)}
.gchip b{font-size:13.5px}
.gchip .dash,.glegend .dash{width:30px;height:0;border-top:3px dashed var(--globe-arc);flex:none}
.glegend{border-radius:999px;gap:16px}
.glegend span{display:inline-flex;align-items:center;gap:6px}
.glegend .pt{width:7px;height:7px;border-radius:50%;background:var(--globe-pt)}
.glegend .pt.b{width:12px;height:12px}
.glegend .ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--globe-home);box-sizing:border-box}
.gscrub{display:flex;align-items:center;gap:12px;margin-top:28px;max-width:470px}
.gscrub .replay{width:44px;height:44px;flex:none;border-radius:999px;display:grid;place-items:center;
  border:1.5px solid var(--hero-ink);color:var(--hero-ink);background:var(--hero-ghost)}
.gscrub .replay:hover{background:var(--hero-ghost-on)}
.gscrub label{flex:1;min-width:0;display:flex}
.gscrub input{width:100%;height:44px;margin:0;accent-color:var(--globe-pt);cursor:pointer}
.gscrub output{font:600 15px/1 var(--serif);color:var(--hero-ink);white-space:nowrap;
  font-variant-numeric:tabular-nums;min-width:8.5em}
.hero.globe .gcap{margin:6px 0 0;font-size:12.5px;max-width:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:900px){
  .hero.globe{--gw:min(100vw,560px);height:auto}
  .hero.globe .inner{max-width:none;padding:calc(var(--gw)*1.02) 18px 30px;
    background:linear-gradient(180deg,transparent calc(var(--gw)*.72),var(--paper) calc(var(--gw)*1.0))}
  .gbox{top:calc(var(--gw)*-.2);left:50%;width:calc(var(--gw)*1.6);height:calc(var(--gw)*1.6);
    transform:translateX(-50%)}
  .gnote{top:12px;left:16px;right:auto;bottom:auto}
  .glegend{display:none}
  .gscrub{max-width:none}
}

/* ── 홈: 숫자 띠 (오른쪽에 수채 지도) ── */
.band{position:relative;overflow:hidden;background:var(--paper);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.band::after{content:"";position:absolute;right:0;top:0;bottom:0;width:min(44%,460px);
  background:var(--art-map) right center/cover no-repeat;
  opacity:var(--art-op);filter:var(--art-filter);
  -webkit-mask-image:linear-gradient(270deg,#000 52%,transparent);
  mask-image:linear-gradient(270deg,#000 52%,transparent)}
.band .eyebrow{position:relative;z-index:1;padding:15px 24px 0;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
.band .nums{position:relative;z-index:1;display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));max-width:620px;padding:10px 24px 18px}
.band .nums div{text-align:center;border-right:1px solid var(--line);padding:4px 6px}
.band .nums div:last-child{border-right:0}
.band .nums svg{width:19px;height:19px;color:var(--navy);opacity:.85;margin-bottom:3px}
.band b{display:block;font:600 26px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.band small{color:var(--dim);font-size:11.5px;letter-spacing:.04em}
@media (max-width:760px){
  .band::after{display:none}
  .band .nums{max-width:none;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:4px}
}

/* ── 홈: 섹션 ── */
.sec{padding:44px 24px;max-width:1180px;margin:0 auto}
.sechead{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.sechead .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.sechead h3 svg{width:23px;height:23px;flex:none;color:var(--navy);opacity:.9;
  vertical-align:-4px;margin-right:9px;display:inline-block}
.sechead h3{font:600 clamp(21px,2.6vw,29px)/1.25 var(--serif);flex-basis:100%}
.sechead p{margin:0;color:var(--dim);font-size:13.5px;max-width:60ch}
.sechead .more{margin-left:auto;font-size:13px;color:var(--accent);white-space:nowrap}

/* 대표 여행지 한 장 — 원화의 큰 카드 자리다. */
.dfeat{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);
  box-shadow:var(--shadow);margin-bottom:18px}
.dfeat .ph{position:relative;min-height:270px;overflow:hidden;cursor:pointer;
  background:linear-gradient(140deg,var(--ph1),var(--ph2))}
.dfeat .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.dfeat:hover .ph img{transform:scale(1.04)}
.dfeat .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:34px 18px 14px;
  color:#fff;background:linear-gradient(transparent,rgba(12,10,7,.8))}
.dfeat .cap b{font:600 clamp(22px,2.4vw,28px)/1.2 var(--serif)}
.dfeat .cap span{font-size:12.5px;opacity:.86;margin-left:9px}
.dfeat .body{padding:22px 24px 20px;display:flex;flex-direction:column}
.dfeat .body p{margin:0;font-size:13.5px;color:var(--dim)}
.dfeat .acts{display:flex;gap:9px;margin-top:auto;padding-top:20px;flex-wrap:wrap;
  align-items:center}
.dfeat .acts .solid{padding:9px 17px;border-radius:999px;background:var(--navy);
  color:var(--paper);font-size:13px;font-weight:600}
.dfeat .acts .out{padding:9px 17px;border-radius:999px;border:1px solid var(--line);
  font-size:13px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--bg)}
.dfeat .src{margin-top:11px;font-size:10.5px;color:var(--dim)}
@media (max-width:760px){.dfeat{grid-template-columns:1fr}.dfeat .ph{min-height:210px}}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:18px}
.dcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);
  box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.dcard:hover{transform:translateY(-3px);box-shadow:var(--lift)}
.dcard .ph{position:relative;aspect-ratio:16/10;background:linear-gradient(140deg,var(--ph1),var(--ph2));
  cursor:pointer;overflow:hidden}
.dcard .ph img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;
  transition:transform .5s}
.dcard:hover .ph img{transform:scale(1.045)}
.dcard .ph .nolabel,.dfeat .ph .nolabel{position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;
  font:600 19px/1.2 var(--serif);color:rgba(255,255,255,.92)}
.dcard .visits{position:absolute;z-index:2;left:10px;top:10px;padding:3px 9px;

<body>

<header class="site">
  <button id="menuBtn" aria-label="메뉴">☰</button>
  <button class="brand" data-view="home">
    <b id="brandName">나의 여행 지도</b><span id="brandSub"></span>
  </button>
  <input id="search" placeholder="도시·여정 검색" autocomplete="off">
  <nav class="tabs" id="tabs">
    <button data-view="home" aria-selected="true">홈</button>
    <button data-view="destinations" aria-selected="false">여행지</button>
    <button data-view="map" aria-selected="false">지도</button>
    <button data-view="timeline" aria-selected="false">연표</button>
    <button data-view="region" aria-selected="false">지역</button>
    <button data-view="stats" aria-selected="false">통계</button>
    <button data-view="candidates" aria-selected="false" id="candTab" hidden>후보</button>
  </nav>
  <button class="cta-btn" id="ctaTop">동행 문의</button>
</header>

<div class="wrap" id="wrap">
  <aside id="aside">
    <h3>시대</h3>
    <div id="eraList"></div>
    <h3>성격</h3>
    <div id="scopeList"></div>
    <h3>목적</h3>
    <div id="legend"></div>
  </aside>
  <main id="mainCol">
    <div class="bar" id="bar"></div>
    <div id="view"></div>
  </main>
</div>

<div id="panel"><button class="close" aria-label="닫기">✕</button><div id="panelBody"></div></div>

<script>
const DATA = /*__DATA__*/;
const {eras:ERAS, trips:TRIPS, places:PLACES, world:WORLD} = DATA;
const CANDS = DATA.candidates || [];

const PURPOSE = {
  business:"출장", expat:"주재", family:"가족여행", couple:"부부여행",
  friends:"친구여행", pilgrimage:"성지순례", solo:"혼자"
};
const SRC = {blog:"블로그", gdoc:"구글 문서", gsheet:"구글 시트", gmaps_saved:"지도 저장목록",
  calendar:"캘린더", memory:"기억", photo:"사진", itinerary:"일정표", fix:"보정"};

/* 여정 → 일정표. data/trip_html 의 파일을 app/itinerary/ 로 옮겨 둔 것이다.
   한 여정에 여러 장이 붙을 수 있다 — 떠나기 전의 계획과 다녀와서 쓴 기록처럼. */
const ITINS = DATA.itineraries || [];
const itinOf = new Map();
for (const i of ITINS) itinOf.set(i.tripId, [...(itinOf.get(i.tripId) || []), i]);
const itinHref = i => "itinerary/" + i.file;

const byName = new Map(PLACES.map(p => [p.name, p]));
const year = t => +String(t.start).slice(0,4);
const endYear = t => +String(t.end).slice(0,4);
const YEARS = TRIPS.map(year);
const Y0 = Math.min(...YEARS), Y1 = Math.max(...YEARS.concat(TRIPS.map(endYear)));

/* 도시·장소마다 어떤 여정이 걸리는지 (포괄 여정 포함).
   장소는 여정의 places 에 따로 들어 있다 — 도시 목록에 섞지 않는다. */
const spots = t => t.cities.concat(t.places || []);
const tripsOf = new Map();
for (const t of TRIPS) for (const c of spots(t)) {
  if (!tripsOf.has(c)) tripsOf.set(c, []);
  if (!tripsOf.get(c).includes(t)) tripsOf.get(c).push(t);
}
for (const p of PLACES) {
  const ts = tripsOf.get(p.name) || [];
  const tally = {};
  ts.forEach(t => tally[t.purpose] = (tally[t.purpose]||0) + (t.umbrella?0.2:1));
  p.purpose = Object.keys(tally).sort((a,b)=>tally[b]-tally[a])[0] || "expat";
  p.firstYear = ts.length ? Math.min(...ts.map(year)) : null;
}

const state = {view:"home", scale:"world", era:null, scope:null, year:Y1, q:"",
  gmap:false, tour:true};   // tour — 홈의 여행지를 3D 투어로 본다 (안 되면 격자)

/* 구글 지도는 곁들이다. 기본은 번들 안의 지도이고(PRD §8 — 밖을 안 탄다),
   키가 있을 때만 '구글 지도' 단추가 생기고, 눌렀을 때만 스크립트를 불러온다. */
const MAPS_KEY = DATA.mapsKey || "";

/* ── 투영 ── */
const VIEWS = {
  world:{lon:[-180,180], lat:[84,-58], w:1000},
  china:{lon:[72,136],   lat:[54,16],  w:1000},
  asia: {lon:[66,148],   lat:[54,-12], w:1000}
};
function frame(){
  const v = VIEWS[state.scale];
  const h = v.w * (v.lat[0]-v.lat[1]) / (v.lon[1]-v.lon[0]);
  return {...v, h};
}
function proj(lat, lng, f){
  return [ (lng - f.lon[0]) / (f.lon[1]-f.lon[0]) * f.w,
           (f.lat[0] - lat) / (f.lat[0]-f.lat[1]) * f.h ];
}

/* ── 필터 ── */
function visibleTrips(){
  return TRIPS.filter(t =>
    (!state.era || t.era === state.era) &&
    (!state.scope || t.scope === state.scope) &&
    year(t) <= state.year);
}
function visiblePlaces(){
  const ok = new Set();
  visibleTrips().forEach(t => spots(t).forEach(c => ok.add(c)));
  return PLACES.filter(p => ok.has(p.name) && p.lat !== null);
}

/* ── 사이드바 ── */
function renderAside(){
  const eraCount = {};
  TRIPS.forEach(t => eraCount[t.era] = (eraCount[t.era]||0)+1);
  const el = document.getElementById("eraList");
  el.innerHTML = "";
  el.append(chip("전체", null, "era", TRIPS.length));
  ERAS.forEach(e => el.append(chip(
    `${e.id} ${e.name}`, e.id, "era", eraCount[e.id]||0,
    `${e.start.slice(0,4)}~${e.end?e.end.slice(0,4):"현재"} · ${e.role}`)));

  const sc = document.getElementById("scopeList");
  sc.innerHTML = "";
  sc.append(chip("전체", null, "scope", TRIPS.length));
  [["overseas","해외"],["domestic","국내"]].forEach(([k,label]) =>
    sc.append(chip(label, k, "scope", TRIPS.filter(t=>t.scope===k).length)));

  document.getElementById("legend").innerHTML = Object.entries(PURPOSE).map(([k,v]) =>
    `<div class="legend"><i class="dot" style="background:var(--${k})"></i>${v}</div>`).join("");
}
function chip(label, value, key, n, title){
  const b = document.createElement("button");
  b.className = "chip";
  b.innerHTML = `${label}<span class="n">${n}</span>`;
  if (title) b.title = title;
  b.setAttribute("aria-pressed", String(state[key] === value));
  b.onclick = () => { state[key] = value; renderAside(); render(); closeAside(); };
  return b;
}

/* ── 상단 도구 ── */
function renderBar(){
  const bar = document.getElementById("bar");
  bar.innerHTML = "";
  if (state.view === "home" || state.view === "destinations") return;
  if (state.view === "map"){
    const seg = document.createElement("div");
    seg.className = "seg";
    [["world","세계"],["asia","아시아"],["china","중국"]].forEach(([k,label])=>{
      const b = document.createElement("button");
      b.textContent = label;
      b.setAttribute("aria-pressed", String(!state.gmap && state.scale===k));
      b.onclick = ()=>{ state.gmap=false; state.scale=k; render(); };
      seg.append(b);
    });
    bar.append(seg);
    if (MAPS_KEY){   // 키가 있을 때만 — 없으면 번들 지도만 쓴다
      const g = document.createElement("div");
      g.className = "seg";
      const b = document.createElement("button");
      b.textContent = "구글 지도";
      b.title = "확대·축소하며 둘러봅니다";
      b.setAttribute("aria-pressed", String(state.gmap));
      b.onclick = ()=>{ state.gmap = !state.gmap; render(); };
      g.append(b);
      bar.append(g);
    }
  }
  if (state.view === "candidates") return;
  if (state.view === "map" || state.view === "timeline"){
    const lab = document.createElement("span");
    lab.className = "yearlab";
    lab.textContent = `~ ${state.year}년`;
    const sl = document.createElement("input");
    sl.type = "range"; sl.id = "year"; sl.min = Y0; sl.max = Y1; sl.value = state.year;
    sl.oninput = e => { state.year = +e.target.value; lab.textContent = `~ ${state.year}년`; render(true); };
    bar.append(sl, lab);
  }
}

/* ── 지도 ── */
/* ── 구글 지도 (곁들이) ─────────────────────────────────────────────────
   스크립트는 처음 누를 때 한 번만 불러온다. 못 불러오면 번들 지도로 되돌린다. */
let gmapsLoading = null;
function loadGoogleMaps(){
  if (window.google?.maps) return Promise.resolve();
  if (gmapsLoading) return gmapsLoading;
  gmapsLoading = new Promise((ok, fail) => {
    // loading=async 를 쓸 때는 onload 가 아니라 callback 으로 준비를 알린다.
    // onload 시점에는 google.maps 가 아직 없어 Map 생성이 터진다.
    window.__gmapsReady = () => ok();
    const s = document.createElement("script");
    s.async = true;
    s.src = "https://maps.googleapis.com/maps/api/js?loading=async&language=ko" +
      "&callback=__gmapsReady&key=" + encodeURIComponent(MAPS_KEY);
    s.onerror = () => fail(new Error("script"));
    document.head.append(s);
  });
  return gmapsLoading;
}
function mountGoogleMap(){
  const box = document.getElementById("gmap"); if (!box) return;
  const pts = visiblePlaces().filter(p => p.lat != null);
  loadGoogleMaps().then(() => {
    const dark = matchMedia("(prefers-color-scheme:dark)").matches &&
      document.documentElement.dataset.theme !== "light";
    const map = new google.maps.Map(box, {
      center: {lat: 30, lng: 110}, zoom: 3, mapTypeControl: false,
      streetViewControl: false, fullscreenControl: true,
      backgroundColor: dark ? "#16150f" : "#e8eef3",
      styles: dark ? [
        {elementType:"geometry", stylers:[{color:"#22201a"}]},
        {elementType:"labels.text.fill", stylers:[{color:"#9a9184"}]},
        {elementType:"labels.text.stroke", stylers:[{color:"#16150f"}]},
        {featureType:"water", elementType:"geometry", stylers:[{color:"#12171c"}]},
        {featureType:"poi", stylers:[{visibility:"off"}]},
      ] : [{featureType:"poi", stylers:[{visibility:"off"}]}],
    });
    const css = getComputedStyle(document.documentElement);
    const bounds = new google.maps.LatLngBounds();
    for (const p of pts){
      const pos = {lat: p.lat, lng: p.lng};
      bounds.extend(pos);
      const m = new google.maps.Marker({   // AdvancedMarker 는 mapId 가 있어야 한다
        position: pos, map, title: p.name + (p.visits ? ` · ${p.visits}회` : ""),
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: p.level === "poi" ? 3.5 : 5 + Math.min(Math.sqrt(p.visits) * 2, 8),
          fillColor: css.getPropertyValue("--" + p.purpose).trim() || "#9a6a3a",
          fillOpacity: p.level === "poi" ? .6 : .88,
          strokeColor: "#fff", strokeWeight: 1,
        },
      });
      m.addListener("click", () => openPlace(p.name));
    }
    if (pts.length) map.fitBounds(bounds, 40);
  }).catch(() => {
    state.gmap = false;
    box.outerHTML = `<div class="empty">구글 지도를 불러오지 못했습니다.
      <br><small>키 제한이나 네트워크를 확인하세요. 아래는 번들 지도입니다.</small></div>`;
    render();
  });
}

function viewMap(){
  if (state.gmap && MAPS_KEY){
    const n = visiblePlaces().filter(p => p.lat != null).length;
    return `<div id="gmap" class="gmap"></div>
      <p style="color:var(--dim);font-size:12px;margin:8px 2px">
        점 ${n}개 · 끌어서 옮기고 굴려서 확대합니다. 점을 누르면 상세가 열립니다.
        지도는 Google 제공.</p>`;
  }
  const f = frame();
  const pts = visiblePlaces();
  const paths = WORLD.map(c => c.rings.map(r =>
    "M" + r.map(([lo,la]) => proj(la,lo,f).map(n=>n.toFixed(1)).join(",")).join("L") + "Z"
  ).join("")).join("");

  const big = pts.filter(p => p.level !== "poi");
  const pins = pts.map(p => {
    const [x,y] = proj(p.lat, p.lng, f);
    const r = p.level === "poi" ? 2.2 : 3.2 + Math.min(Math.sqrt(p.visits)*1.7, 6);
    return `<circle class="pin" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"
      fill="var(--${p.purpose})" fill-opacity="${p.level==="poi"?.55:.85}"
      data-place="${esc(p.name)}"><title>${esc(p.name)}${p.visits?` · ${p.visits}회`:""}</title></circle>`;
  }).join("");

  // 이름은 겹치지 않을 때만 — 지도가 지저분해지지 않게
  const taken = [];
  const labels = state.scale === "world" ? "" : big
    .sort((a,b)=>b.visits-a.visits).map(p => {
      const [x,y] = proj(p.lat, p.lng, f);
      if (taken.some(t => Math.abs(t[0]-x)<42 && Math.abs(t[1]-y)<11)) return "";
      taken.push([x,y]);
      return `<text class="plabel" x="${(x+6).toFixed(1)}" y="${(y+3).toFixed(1)}">${esc(p.name)}</text>`;
    }).join("");

  if (!pts.length) return `<div class="empty">이 조건에 해당하는 장소가 없습니다.</div>`;
  return `<svg class="map" viewBox="0 0 ${f.w} ${f.h.toFixed(0)}" role="img"
    aria-label="방문 도시 지도"><path class="land" d="${paths}"/>${pins}${labels}</svg>
    <p style="color:var(--dim);font-size:12px;margin:8px 2px">
      점 ${pts.length}개 · 큰 점은 도시, 작은 점은 그 안의 장소. 점을 누르면 상세가 열립니다.</p>`;
}

/* ── 연표 ── */
function viewTimeline(){
  const ts = visibleTrips();
  if (!ts.length) return `<div class="empty">해당하는 여정이 없습니다.</div>`;
  const byYear = {};
  ts.forEach(t => (byYear[year(t)] ||= []).push(t));
  let html = `<div class="tl">`;
  for (let y = Y1; y >= Y0; y--){
    const list = byYear[y];
    if (!list) continue;
    const era = ERAS.find(e => e.id === list[0].era);
    html += `<div class="yr">${y}</div><div class="row">` +
      (era ? `<div class="eratag" style="width:100%">${era.id} · ${era.name}</div>` : "") +
      list.map(t => badge(t)).join("") + `</div>`;
  }
  return html + `</div>`;
}
function badge(t){
  return `<button class="tbadge" data-trip="${esc(t.id)}">
    <i class="dot" style="background:var(--${t.purpose})"></i>
    <span>${esc(t.title)}</span>
    ${itinOf.has(t.id) ? `<span class="pin">일정표</span>` : ""}</button>`;
}

/* ── 지역 ── */
function viewRegion(){
  const ok = new Set(); visibleTrips().forEach(t => spots(t).forEach(c => ok.add(c)));
  const groups = {};
  PLACES.filter(p => ok.has(p.name)).forEach(p => {
    (groups[p.country || "미분류"] ||= []).push(p);
  });
  const keys = Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  if (!keys.length) return `<div class="empty">해당하는 지역이 없습니다.</div>`;
  return `<div class="tree">` + keys.map(country => {
    const list = groups[country].sort((a,b)=> (b.visits-a.visits) || a.name.localeCompare(b.name,"ko"));
    return `<section><h4>${esc(country)}<span class="n">${list.length}</span></h4>` +
      list.map(p => `<button class="rowlink" data-place="${esc(p.name)}">
        ${esc(p.name)}${p.level==="poi"?'<em> · 장소</em>':""}
        <span class="n">${p.visits||""}</span></button>`).join("") + `</section>`;
  }).join("") + `</div>`;
}

/* ── 통계 ── */
function viewStats(){
  const ts = visibleTrips();
  const cities = new Set(), countries = new Set();
  ts.forEach(t => spots(t).forEach(c => {
    const p = byName.get(c); if (!p) return;
    if (p.level !== "poi") cities.add(c);
    if (p.country) countries.add(p.country);
  }));
  const counted = ts.filter(t => !t.umbrella);
  const top = [...byName.values()].filter(p=>p.visits).sort((a,b)=>b.visits-a.visits).slice(0,8);
  const first = counted.filter(t=>t.confidence!=="low").sort((a,b)=>t2n(a)-t2n(b))[0];
  const cards = [
    [cities.size, "도시"], [countries.size, "나라"], [counted.length, "여정"],
    [new Set(ts.map(t=>t.era)).size, "시대"],
    [ts.filter(t=>t.purpose==="business").length, "출장"],
    [ts.filter(t=>["family","couple","friends"].includes(t.purpose)).length, "가족·친구 여행"]
  ];
  return `<div class="cards">` + cards.map(([n,l]) =>
    `<div class="card"><b>${n}</b><small>${l}</small></div>`).join("") + `</div>
    <div class="card" style="margin-top:12px">
      <h4 style="font-size:12px;color:var(--dim);margin:0 0 8px">가장 많이 간 곳</h4>
      ${top.map(p=>`<button class="rowlink" data-place="${esc(p.name)}">${esc(p.name)}
        <span class="n">${p.visits}회</span></button>`).join("") || "<small>없음</small>"}
      ${first?`<p style="font-size:12.5px;color:var(--dim);margin:10px 0 0">
        가장 이른 확정 여정 · ${esc(first.title)} (${first.start})</p>`:""}
    </div>`;
}
const t2n = t => String(t.start).padEnd(10,"0");

/* ── 후보 승인 (PRD Phase 2) ──
   블로그에서 뽑은 여정 후보. 자동 등록하지 않고 여기서 승인한 것만 내보낸다. */
const DEC_KEY = "candidateDecisions";
function decisions(){
  try { return JSON.parse(localStorage.getItem(DEC_KEY) || "{}"); } catch { return {}; }
}
function decide(logNo, how){
  const d = decisions();
  if (how) d[logNo] = how; else delete d[logNo];
  try { localStorage.setItem(DEC_KEY, JSON.stringify(d)); } catch {}
  render();
}
function viewCandidates(){
  if (!CANDS.length) return `<div class="empty">후보가 없습니다.
    <br><small>python scripts/classify_posts.py 를 먼저 돌리세요.</small></div>`;
  const d = decisions();
  const f = state.candFilter || "todo";
  const pick = {
    todo: c => !d[c.logNo],
    ok:   c => d[c.logNo] === "ok",
    drop: c => d[c.logNo] === "drop",
    all:  () => true
  }[f];
  const list = CANDS.filter(pick);
  const n = k => CANDS.filter({todo:c=>!d[c.logNo], ok:c=>d[c.logNo]==="ok",
    drop:c=>d[c.logNo]==="drop", all:()=>true}[k]).length;

  return `<div class="bar">
      <div class="seg">${[["todo","검토 전"],["ok","승인"],["drop","버림"],["all","전체"]]
        .map(([k,l])=>`<button data-cf="${k}" aria-pressed="${f===k}">${l} ${n(k)}</button>`).join("")}</div>
      <button class="tbadge" id="exportBtn">승인한 것 내보내기</button>
    </div>
    <p style="color:var(--dim);font-size:12.5px;margin:0 0 10px">
      블로그 글에서 뽑은 여정 후보입니다. 승인한 것만 <code>trips.json</code> 으로 내보냅니다.
      “LLM 판정”이 아닌 것은 제목 규칙으로 고른 것이라 오탐이 있습니다.</p>
    ${list.slice(0,300).map(c=>candRow(c, d[c.logNo])).join("") ||
      `<div class="empty">해당하는 후보가 없습니다.</div>`}
    ${list.length>300?`<p style="color:var(--dim);font-size:12px">외 ${list.length-300}건</p>`:""}`;
}
function candRow(c, dec){
  return `<div class="card" style="margin-bottom:8px;padding:11px 13px">
    <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
      <b style="font-size:13px;color:var(--dim);font-weight:500">${esc(c.date || c.posted)}</b>
      <span style="flex:1;min-width:180px;font-size:14px">${esc(c.title)}</span>
      <a href="${esc(c.url)}" target="_blank" rel="noopener"
         style="font-size:12px">원문</a>
    </div>
    <div style="margin-top:6px">
      ${c.cities.map(x=>`<span class="tag">${esc(x)}</span>`).join("") ||
        `<span class="tag">도시 못 찾음</span>`}
      <span class="tag">${c.verdict==="ask"?"미판정":"여행"}</span>
      <span class="tag">${esc(c.why)}</span>
    </div>
    <div style="margin-top:7px;display:flex;gap:6px">
      <button class="tbadge" data-dec="ok" data-log="${c.logNo}"
        ${dec==="ok"?'style="border-color:var(--family);color:var(--family)"':""}>승인</button>
      <button class="tbadge" data-dec="drop" data-log="${c.logNo}"
        ${dec==="drop"?'style="border-color:var(--couple);color:var(--couple)"':""}>버림</button>
      ${dec?`<button class="tbadge" data-dec="" data-log="${c.logNo}">되돌리기</button>`:""}
    </div></div>`;
}
function exportApproved(){
  const d = decisions();
  const rows = CANDS.filter(c => d[c.logNo] === "ok").map(c => ({
    id: "t-blog-" + c.logNo,
    title: c.title,
    start: c.date || c.posted,
    end: c.date || c.posted,
    era: eraOf(c.date || c.posted),
    purpose: "couple",
    scope: c.cities.some(x => ["서울","제주","부여","양평","평택","남해","유명산"]
      .includes(x)) ? "domestic" : "overseas",
    cities: c.cities,
    sources: ["blog"],
    confidence: "medium",
    blog: c.url
  }));
  panel(`<h2>승인한 후보 ${rows.length}건</h2>
    <div class="meta">아래를 <code>data/trips.json</code> 의 <code>trips</code> 배열에 붙여 넣고
      다시 빌드하세요. 목적(purpose)과 성격(scope)은 추정값이라 손봐야 합니다.</div>
    <textarea readonly style="width:100%;height:340px;font:12px/1.5 ui-monospace,monospace;
      background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;
      padding:10px">${esc(JSON.stringify(rows, null, 1))}</textarea>`);
}
function eraOf(date){
  const d = String(date).slice(0,7);
  for (const e of ERAS)
    if (d >= e.start.slice(0,7) && (!e.end || d <= e.end.slice(0,7))) return e.id;
  return ERAS[ERAS.length-1].id;
}

/* ── 상세 패널 ── */
function openPlace(name){
  const p = byName.get(name); if (!p) return;
  const ts = (tripsOf.get(name) || []).sort((a,b)=>t2n(a).localeCompare(t2n(b)));
  const kids = PLACES.filter(k => k.parent === name);
  panel(`${destHead(name)}<h2>${esc(p.name)}</h2>
    <div class="meta">${[p.country, p.region].filter(Boolean).join(" · ") || "&nbsp;"}</div>
    ${p.aliasesSeen?.length ? `<div>${p.aliasesSeen.map(a=>`<span class="tag">${esc(a)}</span>`).join("")}</div>`:""}
    ${p.note ? `<p style="font-size:12.5px;color:var(--dim)">${esc(p.note)}</p>`:""}
    ${p.needsReview ? `<span class="tag">확인 필요</span>`:""}
    <section><h4>여정 ${ts.length}</h4>
      ${ts.map(t=>`<button class="rowlink" data-trip="${esc(t.id)}">
        ${esc(t.title)}<em> · ${t.start}${t.umbrella?" (포괄)":""}</em>
        ${itinOf.has(t.id)?`<span class="pin">일정표</span>`:""}</button>`).join("") ||
        "<small style='color:var(--dim)'>연결된 여정이 없습니다.</small>"}</section>
    ${kids.length?`<section><h4>이 도시의 장소 ${kids.length}</h4>
      ${kids.map(k=>`<button class="rowlink" data-place="${esc(k.name)}">${esc(k.name)}
        ${k.kind?`<em> · ${esc(k.kind)}</em>`:""}</button>`).join("")}</section>`:""}
    ${destSection(name)}
    <section><h4>출처</h4>${(p.sources||[]).map(s=>`<span class="tag">${SRC[s]||s}</span>`).join("")}</section>
    ${photoBox("place:"+name)}`);
}
function openTrip(id){
  const t = TRIPS.find(x => x.id === id); if (!t) return;
  const era = ERAS.find(e => e.id === t.era);
  panel(`<h2>${esc(t.title)}${t.planned?` <span class="pin">예정</span>`:""}</h2>
    <div class="meta">${t.start}${t.end!==t.start?` ~ ${t.end}`:""} ·
      ${PURPOSE[t.purpose]} · ${t.scope==="domestic"?"국내":"해외"}</div>
    ${itinSection(t)}
    ${t.summary?`<p style="font-size:13.5px">${esc(t.summary)}</p>`:""}
    ${t.note?`<p style="font-size:12.5px;color:var(--dim)">${esc(t.note)}</p>`:""}
    <section><h4>도시 ${t.cities.length}</h4>
      ${t.cities.slice(0,60).map(c=>`<button class="rowlink" data-place="${esc(c)}">${esc(c)}</button>`).join("")}
      ${t.cities.length>60?`<small style="color:var(--dim)">외 ${t.cities.length-60}곳</small>`:""}</section>
    ${(t.places||[]).length?`<section><h4>장소 ${t.places.length}</h4>
      ${t.places.map(x=>{const p=byName.get(x); return `<button class="rowlink" data-place="${esc(x)}">
        ${esc(x)}${p&&p.kind?`<em> · ${esc(p.kind)}</em>`:""}
        ${p&&p.needsReview?`<span class="pin">확인 필요</span>`:""}</button>`;}).join("")}</section>`:""}
    ${t.companions.length?`<section><h4>동행</h4>
      ${t.companions.map(c=>`<span class="tag">${esc(c)}</span>`).join("")}</section>`:""}
    <section><h4>맥락</h4>
      <ul>${era?`<li>${era.id} ${era.name} (${era.role})</li>`:""}
      ${t.role?`<li>당시 직책 · ${esc(t.role)}</li>`:""}
      <li>기록 신뢰도 · ${({high:"확정",medium:"보통",low:"기억"})[t.confidence]}</li></ul></section>
    <section><h4>출처</h4>${t.sources.map(s=>`<span class="tag">${SRC[s]||s}</span>`).join("")}</section>
    ${photoBox("trip:"+t.id)}`);
}
/* 일정표가 붙은 여정이면 상세 패널 맨 위에 한 장 띄운다. 누르면 그 일정표가 열린다. */
function itinSection(t){
  const list = itinOf.get(t.id); if (!list) return "";
  const card = i => {
    const when = i.start === i.end ? i.start : `${i.start} ~ ${i.end}`;
    // 새 창을 띄우지 않는다 — 이 창에서 열고, 일정표의 '나의 여행 지도'로 돌아온다.
    return `<a class="itin" href="${esc(itinHref(i))}">
      <b>${esc(i.title)}</b>
      <span class="sub">${when} · ${i.days}일 · ${
        esc(i.subtitle) || i.cities.map(esc).join(" · ")}</span>
      ${i.lead ? `<p>${esc(i.lead)}</p>` : ""}
      <span class="open">일정표 열기 →</span></a>`;
  };
  return `<section style="border-top:0;padding-top:0">
    <h4>일정표 ${list.length > 1 ? list.length : ""}</h4>
    <div class="itins">${list.map(card).join("")}</div></section>`;
}
function panel(html){
  document.getElementById("panelBody").innerHTML = html;
  document.getElementById("panel").classList.add("open");
  wirePhotos();
}

/* ── 사진: EXIF 촬영일시·GPS로 여정에 붙인다 (PRD §7) ── */
function photoBox(key){
  return `<section><h4>사진</h4>
    <div id="drop" data-key="${esc(key)}">사진을 끌어놓거나 눌러서 고르기<br>
      <small>촬영일시·GPS를 읽어 여정을 맞춥니다</small></div>
    <div id="shots"></div>
    <p id="exifMsg" style="font-size:12px;color:var(--dim);margin:8px 0 0"></p></section>`;
}
function wirePhotos(){
  const drop = document.getElementById("drop"); if (!drop) return;
  const key = drop.dataset.key, shots = document.getElementById("shots");
  const load = () => {
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem("photos:"+key) || "[]"); } catch {}
    shots.innerHTML = saved.map(s=>`<img src="${s.thumb}" alt="" title="${s.when||""}">`).join("");
  };
  load();
  const input = Object.assign(document.createElement("input"),
    {type:"file", accept:"image/*", multiple:true});
  input.onchange = e => handle([...e.target.files]);
  drop.onclick = () => input.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("hot"); };
  drop.ondragleave = () => drop.classList.remove("hot");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("hot");
    handle([...e.dataTransfer.files].filter(f=>f.type.startsWith("image/"))); };

  async function handle(files){
    const msg = document.getElementById("exifMsg");
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem("photos:"+key) || "[]"); } catch {}
    const notes = [];
    for (const f of files.slice(0,12)){
      const buf = await f.arrayBuffer();
      const ex = readExif(buf);
      const thumb = await thumbnail(f, 200);
      saved.push({thumb, when: ex.when, lat: ex.lat, lng: ex.lng});
      if (ex.when){
        const hit = TRIPS.find(t => !t.umbrella &&
          ex.when.slice(0,10) >= t.start && ex.when.slice(0,10) <= t.end);
        notes.push(hit ? `${f.name} → ${hit.title}` : `${f.name} → ${ex.when.slice(0,10)} (맞는 여정 없음)`);
      } else notes.push(`${f.name} → 촬영일시 없음`);
    }
    try {
      localStorage.setItem("photos:"+key, JSON.stringify(saved.slice(-24)));
      msg.innerHTML = notes.map(esc).join("<br>");
    } catch {
      msg.textContent = "브라우저 저장 공간이 가득 찼습니다. 사진은 화면에만 남습니다.";
    }
    load();
  }
}
// JPEG APP1(EXIF)에서 DateTimeOriginal과 GPS만 읽는 최소 구현
function readExif(buf){
  const v = new DataView(buf), out = {when:null, lat:null, lng:null};
  if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return out;
  let off = 2;
  while (off < v.byteLength - 4){
    if (v.getUint8(off) !== 0xFF) break;
    const marker = v.getUint8(off+1), size = v.getUint16(off+2);
    if (marker === 0xE1){
      const base = off + 10;                       // "Exif\0\0" 다음
      if (v.getUint32(off+4) !== 0x45786966) break;
      const le = v.getUint16(base) === 0x4949;
      const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
      const rat = p => u32(p) / (u32(p+4) || 1);
      const walk = (dir, want) => {
        const n = u16(dir); const found = {};
        for (let i=0;i<n;i++){
          const e = dir + 2 + i*12, tag = u16(e);
          if (want.includes(tag)) found[tag] = e;
        }
        return found;
      };
      const ifd0 = base + u32(base+4);
      const f0 = walk(ifd0, [0x8769, 0x8825]);
      if (f0[0x8769]){
        const sub = base + u32(f0[0x8769]+8);
        const fe = walk(sub, [0x9003, 0x9004]);
        const p = fe[0x9003] || fe[0x9004];
        if (p){
          const at = base + u32(p+8);
          let s = "";
          for (let i=0;i<19;i++) s += String.fromCharCode(v.getUint8(at+i));
          out.when = s.replace(/^(\d{4}):(\d{2}):(\d{2})/, "$1-$2-$3");
        }
      }
      if (f0[0x8825]){
        const g = base + u32(f0[0x8825]+8);
        const fg = walk(g, [1,2,3,4]);
        const dms = p => { const at = base + u32(p+8);
          return rat(at) + rat(at+8)/60 + rat(at+16)/3600; };
        // Ref는 2바이트 ASCII라 엔트리 안에 그대로 들어 있다. 'S'/'W'면 음수.
        if (fg[2] && fg[1]) out.lat = dms(fg[2]) * (v.getUint8(fg[1]+8) === 83 ? -1 : 1);
        if (fg[4] && fg[3]) out.lng = dms(fg[4]) * (v.getUint8(fg[3]+8) === 87 ? -1 : 1);
      }
      break;
    }
    off += 2 + size;
  }
  return out;
}
function thumbnail(file, size){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = size / Math.max(img.width, img.height);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", .7));
    };
    img.onerror = () => res("");
    img.src = URL.createObjectURL(file);
  });
}

/* ── 검색 ── */
function runSearch(q){
  const s = q.trim().toLowerCase();
  if (!s) return;
  const p = PLACES.find(x => x.name.toLowerCase().includes(s) ||
    (x.aliasesSeen||[]).some(a => a.toLowerCase().includes(s)));
  if (p) return openPlace(p.name);
  const t = TRIPS.find(x => x.title.toLowerCase().includes(s));
  if (t) return openTrip(t.id);
  panel(`<h2>검색</h2><div class="meta">“${esc(q)}”에 맞는 도시나 여정이 없습니다.</div>`);
}

/* ── 여행지 사진 (trip.com 여행 가이드) ──
   사진과 소개 글은 내려받지 않고 원본을 링크로 건다. 출처는 카드마다 밝힌다.
   scripts/fetch_destinations.py 가 data/destinations.json 에 캐시해 둔 것을 쓴다. */
const DESTS = DATA.destinations || [];
const SITE = DATA.site || {};
const destOf = new Map(DESTS.map(d => [d.place, d]));

// trip.com CDN 은 파일명 끝의 _D_1180_558 로 크기를 정한다. 목록에는 작은 것을 쓴다.
function sized(url, w, h){
  if (!url) return "";
  return url.replace(/_[A-Z]_\d+_\d+(_R\d+)?(?=\.\w+(\?|$))/, `_D_${w}_${h}`);
}
// 사진을 못 받으면(오프라인·차단) 그 자리는 흙빛 바탕만 남는다. 화면은 그대로 돈다.
addEventListener("error", e => {
  const t = e.target;
  if (t && t.tagName === "IMG") t.style.visibility = "hidden";
}, true);

const shot = (url, alt) => url
  ? `<img src="${esc(url)}" alt="${esc(alt)}" loading="lazy" decoding="async"
      referrerpolicy="no-referrer">` : "";
const guideLink = d => `<a href="${esc(d.url)}" target="_blank" rel="noopener nofollow"
  title="trip.com 여행 가이드에서 보기">Trip.com 가이드 →</a>`;

/* 홈의 선화 아이콘 한 벌. 원화의 작은 표지들을 자리만 같게 옮겨 놓은 것이다. */
const I = (d, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true">${d}${extra}</svg>`;
const ICON = {

  city: I(`<path d="M3 21h18"/><path d="M5 21V8.5L11 5v16"/><path d="M11 11h6.5V21"/>
           <path d="M8 10.5h0M8 14h0M8 17.5h0M14 14.5h0M14 18h0"/>`),

            <path d="M12 3c2.6 2.6 3.9 5.7 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.7-3.9-9S9.4 5.6 12 3Z"/>`),
  bag: I(`<rect x="3" y="7.5" width="18" height="13" rx="2.2"/>

  cal: I(`<rect x="3" y="5" width="18" height="16" rx="2.2"/><path d="M3 10h18"/>
          <path d="M8 3v4M16 3v4"/><path d="M7.5 14h0M12 14h0M16.5 14h0M7.5 17.5h0M12 17.5h0"/>`),
  compass: I(`<circle cx="12" cy="12" r="9"/><path d="m15.4 8.6-2 4.8-4.8 2 2-4.8Z"/>`),
  pin: I(`<path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11Z"/>

  replay: I(`<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/>`),

/** 사진이 있는 여행지를 방문 횟수 순으로. 홈의 표지와 머리 사진이 이걸 쓴다. */
function featured(){
  return DESTS.filter(d => d.cover).map(d => {
    const p = byName.get(d.place);
    return {...d, visits: p ? p.visits : 0, country: (p && p.country) || d.country};
  }).sort((a,b) => b.visits - a.visits || a.name.localeCompare(b.name, "ko"));
}

/** 여행지 목록은 **다녀온 도시**가 기준이다. trip.com 사진은 있으면 얹는다.
   사진 캐시를 기준으로 세면 가이드가 없는 도시가 통째로 빠져 나라 수와 도시 수가
   통계 탭과 어긋난다 (미국 8곳 중 뉴욕 하나만 세지는 식으로). */
function gallery(){
  return PLACES.filter(p => p.level !== "poi").map(p => {
    const d = destOf.get(p.name) || {};
    return {...d, place: p.name, name: d.name || p.name,
            country: p.country || d.country, visits: p.visits};
  }).sort((a,b) => b.visits - a.visits ||
                   (!!b.cover) - (!!a.cover) ||
                   a.name.localeCompare(b.name, "ko"));
}

/* ── 3D 여행지 투어 (three.js) ─────────────────────────────────────────
   다시 가고 싶은 곳을 카드로 세워 둥글게 돌린다. 끌면 돌고, 앞의 카드를
   누르면 그 도시의 여정이 열린다 — 격자에서 카드를 누르던 것과 같다.

   스크립트는 홈에 들어올 때 한 번만 내려받는다. 구글 지도와 같은 규칙이다
   (PRD §8): 곁들이일 뿐이라 못 받거나 WebGL 이 없으면 투어 자리를 접고
   아래의 격자가 그대로 화면을 맡는다. 사진은 격자와 같은 trip.com 캐시를
   쓰고, 출처는 투어 설명줄에 그대로 남는다. */
const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
let threeLoading = null;
const loadThree = () => (threeLoading ||= import(THREE_URL));

let tour = null;                       // 지금 도는 투어 (렌더할 때마다 접는다)
function stopTour(){ if (tour){ tour.dispose(); tour = null; } }

/** 투어에 세울 카드 — 사진이 있는 도시를 많이 간 순으로 열둘까지. */
function tourItems(){ return featured().filter(d => d.cover).slice(0, 12); }

/** 투어를 접고 격자로 되돌린다. 왜 접혔는지는 한 줄로 남긴다. */
function tourFallback(why){
  state.tour = false;
  const box = document.getElementById("tour");
  if (!box) return;
  box.closest(".sec")?.classList.remove("tourOn");
  box.outerHTML = why
    ? `<div class="empty" style="margin-bottom:18px">${esc(why)}</div>` : "";
}

function mountTour(){
  const stage = document.getElementById("tourStage");
  if (!stage) return;
  const items = tourItems();
  if (!items.length) return tourFallback("");
  loadThree()
    .then(THREE => { if (stage.isConnected) tour = buildTour(THREE, stage, items); })
    .catch(() => tourFallback("3D 투어를 불러오지 못했습니다 — 아래 격자로 보여 드립니다."));
}

/** 카드 한 장을 캔버스에 그린다. 사진이 없으면 격자와 같은 흙빛 바탕에 이름만. */
function tourCard(d, img, cvar){
  const W = 640, PH = 400, H = 560;    // 사진 640×400 은 trip.com 이 주는 크기다
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  if (g.roundRect){ g.beginPath(); g.roundRect(0, 0, W, H, 26); g.clip(); }
  g.fillStyle = cvar("--panel", "#fffdf8"); g.fillRect(0, 0, W, H);

  const grd = g.createLinearGradient(0, 0, W, PH);
  grd.addColorStop(0, cvar("--ph1", "#cbb79c"));
  grd.addColorStop(1, cvar("--ph2", "#9a8f7c"));
  g.fillStyle = grd; g.fillRect(0, 0, W, PH);
  if (img){                            // 사진은 잘라서 채운다 (object-fit:cover 와 같다)
    const s = Math.max(W / img.width, PH / img.height);
    g.drawImage(img, (W - img.width * s) / 2, (PH - img.height * s) / 2,
                img.width * s, img.height * s);
  } else {
    g.fillStyle = "rgba(255,255,255,.92)";
    g.font = `600 40px ${cvar("--serif", "serif")}`;
    g.textAlign = "center"; g.fillText(d.name, W / 2, PH / 2 + 14); g.textAlign = "left";
  }
  if (d.visits){                       // 몇 번 갔는지 — 격자 카드의 그 딱지다
    const label = `${d.visits}번 갔다`;
    g.font = `500 22px ${cvar("--sans", "sans-serif")}`;
    const w = g.measureText(label).width + 30;
    g.fillStyle = "rgba(12,10,7,.55)";
    if (g.roundRect){ g.beginPath(); g.roundRect(22, 22, w, 38, 19); g.fill(); }
    else g.fillRect(22, 22, w, 38);
    g.fillStyle = "#fff"; g.fillText(label, 37, 48);
  }
  g.fillStyle = cvar("--ink", "#1f1c17");
  g.font = `600 44px ${cvar("--serif", "serif")}`;
  g.fillText(d.name, 30, PH + 76);
  g.fillStyle = cvar("--dim", "#7b7264");
  g.font = `24px ${cvar("--sans", "sans-serif")}`;
  g.fillText([d.country, d.enName].filter(Boolean).join(" · "), 30, PH + 118);
  return c;
}

function buildTour(THREE, stage, items){
  const css = getComputedStyle(document.documentElement);
  const cvar = (n, fb) => css.getPropertyValue(n).trim() || fb;
  const slow = matchMedia("(prefers-reduced-motion:reduce)").matches;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:"low-power"});
  } catch(e){
    tourFallback("이 브라우저에서는 3D 투어를 켤 수 없습니다 — 아래 격자로 보여 드립니다.");
    return null;
  }
  const size = () => [stage.clientWidth || 1, stage.clientHeight || 1];
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(...size());
  stage.append(renderer.domElement);

  const N = items.length, step = Math.PI * 2 / N;
  const CW = 2.24, CH = 1.96;          // 카드 크기 (캔버스 640×560 과 같은 비율)
  const R = Math.max(3.1, N * (CW + .75) / (Math.PI * 2));

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(new THREE.Color(cvar("--bg", "#f7f5f0")), R + 1.6, R * 2 + 5.5);
  const camera = new THREE.PerspectiveCamera(42, 1, .1, 100);
  const place = () => {                // 앞의 카드가 꼭 맞게 — 좁으면 그만큼 물러선다
    const [w, h] = size();
    camera.aspect = w / h;
    const tv = Math.tan(camera.fov * Math.PI / 360);
    camera.position.set(0, CH * .66,
      R + .5 + Math.max(CH * .56 / tv, CW * .62 / (tv * camera.aspect)));
    camera.lookAt(0, CH * .54, 0);
    camera.updateProjectionMatrix();
  };
  place();

  const ring = new THREE.Group(); scene.add(ring);
  const geo = new THREE.PlaneGeometry(CW, CH);
  const cards = [];

  // 카드 아래의 그림자 — 바닥을 안 그려도 카드가 서 있어 보인다.
  const shade = document.createElement("canvas");
  shade.width = shade.height = 128;
  {
    const g = shade.getContext("2d");
    const rg = g.createRadialGradient(64, 64, 2, 64, 64, 62);
    rg.addColorStop(0, "rgba(12,10,7,.32)"); rg.addColorStop(1, "rgba(12,10,7,0)");
    g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  }
  const shadeTex = new THREE.CanvasTexture(shade);
  const shadeGeo = new THREE.PlaneGeometry(CW * 1.05, CW * .42);

  items.forEach((d, i) => {
    const canvas = tourCard(d, null, cvar);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      map: tex, transparent: true, toneMapped: false}));
    mesh.userData.i = i;
    mesh.position.y = CH / 2 + .06;

    const sh = new THREE.Mesh(shadeGeo, new THREE.MeshBasicMaterial({
      map: shadeTex, transparent: true, depthWrite: false, opacity: .5}));
    sh.rotation.x = -Math.PI / 2;

    const g = new THREE.Group();
    const a = i * step;
    g.position.set(Math.sin(a) * R, 0, Math.cos(a) * R);
    g.rotation.y = a;
    g.add(sh, mesh);
    ring.add(g);
    cards.push({d, g, mesh, tex, canvas, sh, a});

    // 사진은 카드가 선 뒤에 온다. 못 받으면 흙빛 바탕이 그대로 남는다.
    const img = new Image();
    img.crossOrigin = "anonymous";     // 캔버스에 그리려면 CORS 허락이 있어야 한다
    img.referrerPolicy = "no-referrer";
    img.decoding = "async";
    img.onload = () => {
      canvas.getContext("2d").drawImage(tourCard(d, img, cvar), 0, 0);
      tex.needsUpdate = true;
    };
    img.src = sized(d.cover, 640, 400);
  });

  /* ── 돌리기 ── */
  let rot = 0, target = null, idleUntil = 0, front = -1, alive = true, seen = true;
  const nearest = () => ((Math.round(-rot / step) % N) + N) % N;
  const goTo = i => { target = -i * step; idleUntil = performance.now() + 5000; };
  const spin = n => goTo(nearest() + n);

  const cap = document.getElementById("tourCap");
  function showCap(i){
    if (!cap) return;
    const d = items[i];
    cap.innerHTML = `<b data-place="${esc(d.place)}">${esc(d.name)}</b>
      <span class="where">${esc([d.country, d.enName].filter(Boolean).join(" · "))}${
        d.visits ? ` · ${d.visits}번 갔다` : ""}</span>
      ${d.intro ? `<p>${esc(d.intro)}</p>` : ""}
      <span class="acts">
        <button class="open" data-place="${esc(d.place)}">이 도시의 여정 열기 →</button>
        ${d.url ? guideLink(d) : ""}
        <span class="src">사진·소개 © Trip.com</span></span>`;
  }

  /* ── 손과 키 ── */
  const el = renderer.domElement;
  const ray = new THREE.Raycaster(), pt = new THREE.Vector2();
  function pick(e){
    const r = el.getBoundingClientRect();
    pt.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height * 2 - 1));
    ray.setFromCamera(pt, camera);
    const hit = ray.intersectObjects(cards.map(c => c.mesh))[0];
    return hit ? hit.object.userData.i : -1;
  }
  let drag = null;
  const onDown = e => {
    drag = {x: e.clientX, rot, moved: 0};
    target = null; idleUntil = performance.now() + 5000;
    el.setPointerCapture?.(e.pointerId);
  };
  const onMove = e => {
    idleUntil = performance.now() + 5000;
    if (!drag) return;
    const dx = e.clientX - drag.x;
    drag.moved = Math.max(drag.moved, Math.abs(dx));
    rot = drag.rot + dx * .005;
  };
  const onUp = e => {
    if (!drag) return;
    const tapped = drag.moved < 6 ? pick(e) : -1;
    drag = null;
    if (tapped < 0) return goTo(nearest());   // 끌었으면 가장 가까운 카드로 붙인다
    if (tapped === nearest()) return openPlace(items[tapped].place);
    goTo(tapped);                             // 옆의 카드는 한 번 눌러 앞으로 부른다
  };
  const onKey = e => {
    if (e.key === "ArrowLeft"){ spin(-1); e.preventDefault(); }
    else if (e.key === "ArrowRight"){ spin(1); e.preventDefault(); }
    else if (e.key === "Enter"){ openPlace(items[nearest()].place); e.preventDefault(); }
  };
  const onEnter = () => { idleUntil = Infinity; };   // 얹고 있는 동안은 멈춘다
  const onLeave = () => { idleUntil = performance.now() + 1200; };
  const onLost = e => {
    e.preventDefault();
    tourFallback("3D 투어가 멈췄습니다 — 아래 격자로 보여 드립니다.");
  };

  el.addEventListener("pointerdown", onDown);
  el.addEventListener("pointermove", onMove);
  el.addEventListener("pointerup", onUp);
  el.addEventListener("pointercancel", () => { drag = null; });
  el.addEventListener("webglcontextlost", onLost);
  stage.addEventListener("keydown", onKey);
  stage.addEventListener("pointerenter", onEnter);
  stage.addEventListener("pointerleave", onLeave);
  const box = stage.closest(".tour");
  const prev = box?.querySelector(".arm.prev"), next = box?.querySelector(".arm.next");
  if (prev) prev.onclick = () => spin(-1);
  if (next) next.onclick = () => spin(1);

  const ro = new ResizeObserver(() => { renderer.setSize(...size()); place(); });
  ro.observe(stage);
  const io = new IntersectionObserver(es => { seen = es[0].isIntersecting; }, {threshold:.01});
  io.observe(stage);

  /* ── 그리기 ── */
  let raf = 0, last = performance.now();
  (function frame(now){
    if (!alive) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, .05); last = now;
    if (!seen || document.hidden) return;     // 안 보이면 쉰다

    if (target !== null){
      const d = target - rot;
      if (slow || Math.abs(d) < .0015){ rot = target; target = null; }
      else rot += d * Math.min(1, dt * 7);
    } else if (!drag && !slow && now > idleUntil){
      rot -= .12 * dt;                        // 가만히 두면 천천히 돈다
    }
    ring.rotation.y = rot;

    for (const c of cards){                   // 앞의 카드는 크고 또렷하게
      const near = Math.cos(c.a + rot);
      const lit = Math.max(near, 0);
      c.g.scale.setScalar(.84 + .16 * lit * lit);
      c.g.position.y = .1 * lit;
      c.mesh.material.opacity = .28 + .72 * Math.max((near + .35) / 1.35, 0);
      c.mesh.material.color.setScalar(.62 + .38 * lit);
      c.sh.material.opacity = .5 * lit;
    }
    const f = nearest();
    if (f !== front){ front = f; showCap(f); }
    renderer.render(scene, camera);
  })(last);

  showCap(0);
  return {
    dispose(){
      alive = false; cancelAnimationFrame(raf); ro.disconnect(); io.disconnect();
      el.removeEventListener("pointerdown", onDown);
      el.removeEventListener("pointermove", onMove);
      el.removeEventListener("pointerup", onUp);
      el.removeEventListener("webglcontextlost", onLost);
      stage.removeEventListener("keydown", onKey);
      stage.removeEventListener("pointerenter", onEnter);
      stage.removeEventListener("pointerleave", onLeave);
      cards.forEach(c => { c.tex.dispose(); c.mesh.material.dispose(); c.sh.material.dispose(); });
      geo.dispose(); shadeGeo.dispose(); shadeTex.dispose();
      renderer.dispose();
      el.remove();
    }
  };
}

/* ── 홈 표지: 지구본 ──────────────────────────────────────────────────
   다녀온 도시(도시급, 장소 제외)를 지구본에 점으로 켠다. 점 크기는 다녀온 횟수 —
   지도 탭과 같은 문법이다. 점은 처음 간 해의 순서대로 켜지고, 연도 막대로 되감는다.

   두 겹이다. 먼저 번들의 국경선(WORLD)으로 그린 정지 지구본(SVG)이 서고, three.js 를
   받으면 같은 방향·같은 크기의 돌아가는 지구본이 그 위에 겹쳐 뜬다. three.js 는 3D
   투어와 같은 로더로 한 번만 받는다 — 지구본 라이브러리를 따로 들이지 않는다
   (three-globe 는 three 를 한 벌 더 끌고 온다). 못 받거나 WebGL 이 없거나 컨텍스트를
   잃으면 정지 그림이 그대로 표지를 맡는다. 텍스처 사진도 받지 않는다. */
const RAD = Math.PI / 180;
const G_LAT0 = 30, G_LNG0 = 108;       // 처음 앞을 보는 곳 — 중국과 한반도가 가운데 온다
const G_FIT = 500 / 560;               // 지구본 반지름 ÷ 상자 반폭 (정지 그림과 3D 가 같은 크기로 선다)
const eraYear = id => +String(ERAS.find(e => e.id === id)?.start || Y0).slice(0, 4);
const GPTS = PLACES
  .filter(p => p.level !== "poi" && p.lat != null)
  .map(p => ({p, y: p.firstYear ?? Math.min(...(p.eras || []).map(eraYear), Y1),
              r: 2.4 + 1.5 * Math.sqrt(Math.max(p.visits || 0, 1))}))   // 반지름 500 기준
  .sort((a, b) => a.r - b.r);                                           // 큰 점이 위에
const shortName = n => n.replace(/ (시|현|구|지구)$/, "");

/** 다음 여정 — 아직 다녀오지 않은 예정 여정 가운데 가장 가까운 것. */
function nextTrip(){
  const today = new Date().toISOString().slice(0, 10);
  return TRIPS.filter(t => t.planned && String(t.end || t.start) >= today)
    .sort((a, b) => t2n(a).localeCompare(t2n(b)))[0] || null;
}
/** 서울에서 떠나 그 여정의 도시를 차례로 잇는 길 [[위도, 경도] …]. */
function routeOf(t){
  const r = [];
  for (const n of ["서울", ...t.cities]){
    const p = byName.get(n);
    if (p?.lat == null) continue;
    const last = r[r.length - 1];
    if (!last || last[0] !== p.lat || last[1] !== p.lng) r.push([p.lat, p.lng]);
  }
  return r.length > 1 ? r : [];
}
/** 대권 위의 점들 [위도, 경도, 높이] — 가운데가 살짝 떠오른 호가 된다. */
function greatArc([la1, lo1], [la2, lo2]){
  const v = (la, lo) => [Math.cos(la*RAD)*Math.cos(lo*RAD), Math.cos(la*RAD)*Math.sin(lo*RAD), Math.sin(la*RAD)];
  const a = v(la1, lo1), b = v(la2, lo2);
  const d = Math.acos(Math.min(1, a[0]*b[0] + a[1]*b[1] + a[2]*b[2]));
  if (d < 1e-6) return [];
  const n = Math.max(6, Math.round(d / .02)), lift = Math.min(.1, d * .3), out = [];
  for (let k = 0; k <= n; k++){
    const t = k / n, s1 = Math.sin((1 - t) * d) / Math.sin(d), s2 = Math.sin(t * d) / Math.sin(d);
    const q = a.map((x, i) => s1 * x + s2 * b[i]);
    out.push([Math.asin(q[2]) / RAD, Math.atan2(q[1], q[0]) / RAD, 1 + lift * Math.sin(Math.PI * t)]);
  }
  return out;
}

/** 정지 지구본 — 정사영(G_LAT0, G_LNG0 이 가운데). 3D 를 못 띄울 때도 이것만으로 표지가 선다. */
function globeSVG(){
  const R = 500, sf0 = Math.sin(G_LAT0*RAD), cf0 = Math.cos(G_LAT0*RAD);
  const P = (lng, lat, h = 1) => {
    const l = (lng - G_LNG0) * RAD, f = lat * RAD, cf = Math.cos(f);
    return [R*h*cf*Math.sin(l), -R*h*(cf0*Math.sin(f) - sf0*cf*Math.cos(l)),
            sf0*Math.sin(f) + cf0*cf*Math.cos(l) > 0];
  };
  const n = x => x.toFixed(1);
  // 땅: 뒤로 넘어간 꼭짓점은 가장자리에 붙인다 — 고리가 가장자리를 따라 닫힌다
  const land = WORLD.map(c => c.rings.map(r => {
    let vis = false;
    const pts = r.map(([lo, la]) => {
      let [x, y, v] = P(lo, la);
      if (v) vis = true; else { const d = Math.hypot(x, y) || 1; x = x / d * R; y = y / d * R; }
      return n(x) + "," + n(y);
    });
    return vis ? "M" + pts.join("L") + "Z" : "";
  }).join("")).join("");
  const line = pts => {                 // 앞면에 있는 토막만 잇는다
    let d = "", pen = false;
    for (const [lo, la] of pts){
      const [x, y, v] = P(lo, la);
      if (v){ d += (pen ? "L" : "M") + n(x) + "," + n(y); pen = true; } else pen = false;
    }
    return d;
  };
  const range = (a, b, s) => Array.from({length: Math.floor((b - a) / s) + 1}, (_, i) => a + i * s);
  const grid = range(-180, 150, 30).map(lo => line(range(-85, 85, 5).map(la => [lo, la]))).join("")
             + range(-60, 60, 30).map(la => line(range(-180, 180, 5).map(lo => [lo, la]))).join("");
  const dots = GPTS.map(d => {
    const [x, y, v] = P(d.p.lng, d.p.lat);
    return v ? `<circle class="gpt" cx="${n(x)}" cy="${n(y)}" r="${n(d.r)}" data-y="${d.y}"
      data-place="${esc(d.p.name)}"><title>${esc(d.p.name)}${d.p.visits ? ` · ${d.p.visits}회` : ""}</title></circle>` : "";
  }).join("");
  const nt = nextTrip(), route = nt ? routeOf(nt) : [];
  const arc = route.slice(1).map((b, i) => greatArc(route[i], b)
    .map(([la, lo, h], k) => { const [x, y] = P(lo, la, h); return (k ? "L" : "M") + n(x) + "," + n(y); })
    .join("")).join("");
  const home = byName.get("서울");
  const [hx, hy, hv] = home?.lat != null ? P(home.lng, home.lat) : [0, 0, false];
  return `<svg class="gsvg" viewBox="-560 -560 1120 1120" aria-hidden="true">
    <defs>
      <radialGradient id="gSea" cx="38%" cy="32%" r="75%">
        <stop offset="0" style="stop-color:var(--globe-sea-hi)"/><stop offset="1" style="stop-color:var(--globe-sea)"/></radialGradient>
      <radialGradient id="gAtm" r="50%">
        <stop offset=".86" style="stop-color:var(--globe-atm);stop-opacity:0"/>
        <stop offset=".893" style="stop-color:var(--globe-atm);stop-opacity:.55"/>
        <stop offset="1" style="stop-color:var(--globe-atm);stop-opacity:0"/></radialGradient>
      <radialGradient id="gShade" cx="30%" cy="25%" r="80%">
        <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient>
    </defs>
    <circle r="560" fill="url(#gAtm)"/>
    <circle class="sea" r="${R}"/>
    <path class="grid" d="${grid}"/>
    <path class="land" d="${land}"/>
    <circle r="${R}" fill="url(#gShade)" pointer-events="none"/>
    ${arc ? `<path class="garc" d="${arc}"/>` : ""}
    ${hv ? `<circle class="home" cx="${n(hx)}" cy="${n(hy)}" r="10"/>` : ""}
    ${dots}
  </svg>`;
}

/* 연도: 정지 그림과 3D 가 같은 해를 본다. 들어올 때 한 번 Y0 → Y1 로 켠다. */
let globe = null, gIntro = 0, gPlayed = false;
function setGlobeYear(y){
  const shown = GPTS.filter(d => d.y <= y).length;
  document.querySelectorAll(".gsvg .gpt").forEach(c => c.classList.toggle("off", +c.dataset.y > y));
  document.querySelector(".gsvg .garc")?.classList.toggle("off", y < Y1);
  globe?.setYear(y);
  const inp = document.getElementById("gYear");
  if (inp) inp.value = y;
  const out = document.getElementById("gYearOut");
  if (out) out.textContent = `${y} · 도시 ${shown}`;
  const nc = document.getElementById("nCities");
  if (nc) nc.textContent = y >= Y1 ? PLACES.filter(p => p.level !== "poi").length : shown;
}
function runIntro(){
  cancelAnimationFrame(gIntro); gIntro = 0;
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return setGlobeYear(Y1);
  gPlayed = true;
  const t0 = performance.now() + 250, span = 2400;
  setGlobeYear(Y0);
  const step = now => {
    const k = Math.min(Math.max((now - t0) / span, 0), 1);
    setGlobeYear(Math.round(Y0 + (Y1 - Y0) * k));
    gIntro = k < 1 ? requestAnimationFrame(step) : 0;
  };
  gIntro = requestAnimationFrame(step);
}
function stopGlobe(){
  if (globe){ globe.dispose(); globe = null; }
  // 켜지던 연출을 끊으면 끝 해로 건너뛴다 — 정지 그림이 반쯤 빈 채로 남지 않게
  if (gIntro){ cancelAnimationFrame(gIntro); gIntro = 0; setGlobeYear(Y1); }
}
function mountGlobe(){
  const stage = document.getElementById("globeStage");
  if (!stage) return;
  if (gPlayed) setGlobeYear(Y1); else runIntro();   // 켜지는 연출은 처음 들어왔을 때 한 번만
  loadThree()
    .then(THREE => { if (stage.isConnected && !globe) globe = buildGlobe(THREE, stage); })
    .catch(() => {});                  // 못 받으면 정지 지구본이 그대로 자리를 맡는다
}

function buildGlobe(THREE, stage){
  const css = getComputedStyle(document.documentElement);
  const cvar = (n, fb) => css.getPropertyValue(n).trim() || fb;
  const slow = matchMedia("(prefers-reduced-motion:reduce)").matches;
  const hero = stage.closest(".hero");

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:"low-power"});
  } catch { return null; }             // WebGL 이 없다 — 정지 그림으로 남는다
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  const el = renderer.domElement;
  stage.appendChild(el);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, .1, 50);
  scene.add(camera);
  scene.add(new THREE.AmbientLight(0xffffff, .62 * Math.PI));
  const sun = new THREE.DirectionalLight(0xffffff, .55 * Math.PI);
  sun.position.set(-3, 2.2, 4);
  camera.add(sun);                     // 빛은 카메라를 따라간다 — 돌려도 왼쪽 위가 밝다

  /* 땅과 바다 — 번들 국경선을 등장방형 캔버스에 칠해 구에 입힌다. */
  const TW = renderer.capabilities.maxTextureSize >= 4096 && stage.clientWidth > 700 ? 4096 : 2048;
  const TH = TW / 2, k = TW / 2048;
  const cv = document.createElement("canvas");
  cv.width = TW; cv.height = TH;
  const g = cv.getContext("2d");
  const X = lo => (lo + 180) / 360 * TW, Y = la => (90 - la) / 180 * TH;
  g.fillStyle = cvar("--globe-sea-hi", "#0d4a80"); g.fillRect(0, 0, TW, TH);
  g.strokeStyle = cvar("--globe-grid", "rgba(251,246,238,.09)"); g.lineWidth = k;
  g.beginPath();
  for (let lo = -180; lo <= 180; lo += 30){ g.moveTo(X(lo), 0); g.lineTo(X(lo), TH); }
  for (let la = -60; la <= 60; la += 30){ g.moveTo(0, Y(la)); g.lineTo(TW, Y(la)); }
  g.stroke();
  g.fillStyle = cvar("--globe-land", "#f4ecdc");
  g.strokeStyle = cvar("--globe-coast", "#c9b99a");
  g.lineWidth = 1.1 * k; g.lineJoin = "round";
  for (const c of WORLD) for (const r of c.rings){
    // 날짜변경선을 넘는 고리는 이어 붙이고, 극을 두르는 고리(남극)는 극까지 닫는다
    let prev = r[0][0], off = 0;
    const pts = r.map(([lo, la]) => {
      if (lo - prev > 180) off -= 360; else if (prev - lo > 180) off += 360;
      prev = lo; return [lo + off, la];
    });
    const span = pts[pts.length - 1][0] - pts[0][0];
    if (Math.abs(span) > 180){
      const pole = pts.reduce((s, p) => s + p[1], 0) < 0 ? -90 : 90;
      pts.push([pts[pts.length - 1][0], pole], [pts[0][0], pole]);
    }
    for (const s of [-360, 0, 360]){  // 가장자리를 넘친 조각은 반대편에 다시 칠한다
      g.beginPath();
      pts.forEach(([lo, la], i) => i ? g.lineTo(X(lo + s), Y(la)) : g.moveTo(X(lo + s), Y(la)));
      g.closePath(); g.fill(); g.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  const spin = new THREE.Group();      // 끌면 도는 몸 — 점과 호가 여기에 붙는다
  scene.add(spin);
  const earthGeo = new THREE.SphereGeometry(1, 96, 64);
  const earthMat = new THREE.MeshLambertMaterial({map: tex});
  const earth = new THREE.Mesh(earthGeo, earthMat);
  earth.rotation.y = -Math.PI / 2;     // 구의 UV 는 경도 -90° 에서 시작한다 — 등장방형(-180°)에 맞춘다
  spin.add(earth);

  // 대기 — 가장자리에 번지는 빛. 가운데는 지구가 가린다.
  const ac = document.createElement("canvas");
  ac.width = ac.height = 256;
  const ag = ac.getContext("2d"), grd = ag.createRadialGradient(128, 128, 0, 128, 128, 128);
  const atm = new THREE.Color(cvar("--globe-atm", "#8fc0ea"));
  const rgba = a => `rgba(${atm.r * 255 | 0},${atm.g * 255 | 0},${atm.b * 255 | 0},${a})`;
  grd.addColorStop(0, rgba(0)); grd.addColorStop(.76, rgba(0));
  grd.addColorStop(.82, rgba(.55)); grd.addColorStop(1, rgba(0));
  ag.fillStyle = grd; ag.fillRect(0, 0, 256, 256);
  const atmTex = new THREE.CanvasTexture(ac);
  const atmMat = new THREE.SpriteMaterial({map: atmTex, transparent: true, depthWrite: false});
  const halo = new THREE.Sprite(atmMat);
  halo.scale.setScalar(2.5);
  scene.add(halo);

  const at = (lat, lng, h = 1) => new THREE.Vector3(
    Math.cos(lat*RAD) * Math.sin(lng*RAD), Math.sin(lat*RAD), Math.cos(lat*RAD) * Math.cos(lng*RAD)
  ).multiplyScalar(h);

  // 점 — 겉에 붙인 원판 셋(번짐·테두리·점). 크기는 정지 그림과 같다(반지름 500 기준).
  const disc = new THREE.CircleGeometry(1, 20);
  const mats = [
    new THREE.MeshBasicMaterial({color: cvar("--globe-halo", "#f59e0b"), transparent: true, opacity: .16, depthWrite: false}),
    new THREE.MeshBasicMaterial({color: cvar("--globe-pt-ring", "#6b3000")}),
    new THREE.MeshBasicMaterial({color: cvar("--globe-pt", "#e2861a")}),
  ];
  const dots = GPTS.map(d => {
    const grp = new THREE.Group(), s = d.r / 500;
    grp.position.copy(at(d.p.lat, d.p.lng, 1.001));
    grp.lookAt(grp.position.clone().multiplyScalar(2));
    [[2.3, 0], [1.22, .0004], [1, .0008]].forEach(([m, z], i) => {
      const mesh = new THREE.Mesh(disc, mats[i]);
      mesh.scale.setScalar(s * m); mesh.position.z = z;
      grp.add(mesh);
    });
    spin.add(grp);
    return {...d, grp};
  });
  // 출발점 서울 — 고리
  const ringGeo = new THREE.RingGeometry(.8, 1, 40);
  const ringMat = new THREE.MeshBasicMaterial({color: cvar("--globe-home", "#003261")});
  const home = byName.get("서울");
  if (home?.lat != null){
    const r = new THREE.Mesh(ringGeo, ringMat);
    r.position.copy(at(home.lat, home.lng, 1.0015));
    r.lookAt(r.position.clone().multiplyScalar(2));
    r.scale.setScalar(11.3 / 500);
    spin.add(r);
  }
  // 다음 여정 — 점을 찍어 이은 호 (예정이라 끊어 그린다)
  const beadGeo = new THREE.SphereGeometry(.0052, 8, 6);
  const beadMat = new THREE.MeshBasicMaterial({color: cvar("--globe-arc", "#c2410c")});
  const arc = new THREE.Group();
  const nt = nextTrip(), route = nt ? routeOf(nt) : [];
  route.slice(1).forEach((b, i) => greatArc(route[i], b).forEach(([la, lo, h], j) => {
    if (j % 2) return;
    const m = new THREE.Mesh(beadGeo, beadMat);
    m.position.copy(at(la, lo, h + .002));
    arc.add(m);
  }));
  spin.add(arc);

  let yaw = -G_LNG0 * RAD, pitch = G_LAT0 * RAD;
  function fit(){
    const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const t = G_FIT * Math.tan(15 * RAD) * Math.min(1, w / h);   // 정지 그림과 같은 크기가 되는 거리
    camera.position.set(0, 0, 1 / Math.sin(Math.atan(t)));
    camera.updateProjectionMatrix();
  }
  fit();

  function setYear(y){
    for (const d of dots) d.grp.visible = d.y <= y;
    arc.visible = y >= Y1;
  }
  setYear(+(document.getElementById("gYear")?.value || Y1));

  /* ── 손 ── */
  const tip = document.getElementById("gtip");
  const v = new THREE.Vector3();
  function pick(cx, cy){                // 화면에서 가장 가까운 앞면의 점 (16px 안)
    const r = el.getBoundingClientRect();
    let best = null, bd = 16 * 16;
    for (const d of dots){
      if (!d.grp.visible) continue;
      d.grp.getWorldPosition(v);
      if (v.dot(camera.position) < 1.02) continue;          // 뒤로 넘어간 점
      v.project(camera);
      const dx = (v.x + 1) / 2 * r.width + r.left - cx, dy = (1 - v.y) / 2 * r.height + r.top - cy;
      if (dx * dx + dy * dy < bd){ bd = dx * dx + dy * dy; best = d; }
    }
    return best;
  }
  let hover = null;
  function showTip(d){
    if (hover && hover !== d) hover.grp.scale.setScalar(1);
    hover = d;
    el.style.cursor = d ? "pointer" : "";
    if (!tip) return;
    if (!d){ tip.hidden = true; return; }
    d.grp.scale.setScalar(1.35);
    d.grp.getWorldPosition(v); v.project(camera);
    const r = el.getBoundingClientRect(), hr = hero.getBoundingClientRect();
    const x = (v.x + 1) / 2 * r.width + r.left - hr.left, y = (1 - v.y) / 2 * r.height + r.top - hr.top;
    const p = d.p;
    tip.innerHTML = `<b>${esc(p.name)}</b>
      <span>${p.visits ? `${p.visits}번 다녀옴 · ` : ""}처음 ${d.y}년</span>
      ${p.country ? `<span>${esc(p.country)}</span>` : ""}
      <i>눌러서 도시 기록 열기 →</i>`;
    tip.style.left = x + "px"; tip.style.top = y + "px";
    tip.classList.toggle("flip", x + 260 > hr.width);
    tip.hidden = false;
  }

  let drag = null, vx = 0, idleUntil = performance.now() + 2800;
  const onDown = e => {
    drag = {x: e.clientX, y: e.clientY, yaw, pitch, moved: 0, touch: e.pointerType === "touch"};
    vx = 0;
    if (!drag.touch) el.setPointerCapture?.(e.pointerId);
  };
  const onMove = e => {
    idleUntil = performance.now() + 4000;
    if (!drag){ if (e.pointerType !== "touch") showTip(pick(e.clientX, e.clientY)); return; }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
    if (drag.touch) return;             // 휴대폰에서는 끌어 돌리지 않는다 — 세로 스크롤은 페이지의 것
    const ny = drag.yaw + dx * .005;
    vx = ny - yaw; yaw = ny;
    pitch = Math.max(-.35, Math.min(1.1, drag.pitch + dy * .004));
    if (hover) showTip(null);
  };
  const onUp = e => {
    if (!drag) return;
    const tapped = drag.moved < 6 ? pick(e.clientX, e.clientY) : null;
    drag = null;
    if (tapped){ vx = 0; showTip(null); openPlace(tapped.p.name); }
  };
  const onKey = e => {
    const step = {ArrowLeft: [-.12, 0], ArrowRight: [.12, 0], ArrowUp: [0, -.08], ArrowDown: [0, .08]}[e.key];
    if (!step) return;
    yaw += step[0]; pitch = Math.max(-.35, Math.min(1.1, pitch + step[1]));
    idleUntil = performance.now() + 6000; e.preventDefault();
  };
  const onEnter = e => { if (e.pointerType !== "touch") idleUntil = Infinity; };
  const onLeave = () => { idleUntil = performance.now() + 1200; showTip(null); };
  let alive = true;
  const onLost = e => { e.preventDefault(); stopGlobe(); };   // 정지 그림으로 돌아간다

  el.addEventListener("pointerdown", onDown);
  el.addEventListener("pointermove", onMove);
  el.addEventListener("pointerup", onUp);
  el.addEventListener("pointercancel", () => { drag = null; });
  el.addEventListener("webglcontextlost", onLost);
  stage.addEventListener("keydown", onKey);
  stage.addEventListener("pointerenter", onEnter);
  stage.addEventListener("pointerleave", onLeave);
  const ro = new ResizeObserver(fit);
  ro.observe(stage);
  let seen = true;
  const io = new IntersectionObserver(es => { seen = es[0].isIntersecting; }, {threshold: .01});
  io.observe(stage);

  /* ── 그리기 ── */
  let raf = 0, last = performance.now();
  (function frame(now){
    if (!alive) return;
    raf = requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, .05); last = now;
    if (!seen || document.hidden) return;     // 안 보이면 쉰다 — 아래 3D 투어와 번갈아 돈다
    if (!drag){
      if (Math.abs(vx) > 1e-4){ yaw += vx; vx *= Math.pow(.02, dt); }        // 놓으면 조금 더 돈다
      else if (!slow && now > idleUntil) yaw += .025 * dt;                   // 가만히 두면 천천히 돈다 (한 바퀴 4분)
    }
    spin.rotation.set(pitch, yaw, 0);
    renderer.render(scene, camera);
  })(last);
  requestAnimationFrame(() => hero?.classList.add("glOn"));

  return {
    setYear,
    dispose(){
      alive = false; cancelAnimationFrame(raf); ro.disconnect(); io.disconnect();
      hero?.classList.remove("glOn");
      if (tip) tip.hidden = true;
      el.removeEventListener("pointerdown", onDown);
      el.removeEventListener("pointermove", onMove);
      el.removeEventListener("pointerup", onUp);
      el.removeEventListener("webglcontextlost", onLost);
      stage.removeEventListener("keydown", onKey);
      stage.removeEventListener("pointerenter", onEnter);
      stage.removeEventListener("pointerleave", onLeave);
      [earthGeo, disc, ringGeo, beadGeo].forEach(x => x.dispose());
      [earthMat, atmMat, ringMat, beadMat, ...mats].forEach(x => x.dispose());
      tex.dispose(); atmTex.dispose();
      renderer.dispose();
      el.remove();
    }
  };
}

  stopGlobe();
  const wide = ["home", "destinations", "candidates"].includes(state.view);
  document.getElementById("wrap").classList.toggle("full", wide);
  document.getElementById("mainCol").classList.toggle("home",
    state.view === "home" || state.view === "destinations");
  if (!keepBar) renderBar();
  const v = {home:viewHome, destinations:viewDestinations, map:viewMap,
    timeline:viewTimeline, region:viewRegion, stats:viewStats,
    candidates:viewCandidates}[state.view];
  document.getElementById("view").innerHTML = v();
  if (state.view === "map" && state.gmap && MAPS_KEY) mountGoogleMap();
  if (state.view === "home") mountGlobe();
  if (state.view === "home" && state.tour) mountTour();
  if (state.view === "home") scrollTo({top:0});
  document.getElementById("brandSub").textContent =
    `${PLACES.filter(p=>p.level!=="poi").length}개 도시 · ${Y0}–${Y1}`;
  document.title = `${SITE.brand || "나의 여행 지도"}${
    SITE.tagline ? " · " + SITE.tagline : ""}`;
}

  const tb = e.target.closest("[data-tour]");
  if (tb){                       // 보던 자리는 그대로 두고 투어 ↔ 격자만 바꾼다
    const y = scrollY;
    state.tour = tb.dataset.tour === "on";
    render();
    scrollTo({top:y});
    return;
  }
  if (e.target.closest("[data-greplay]")) return runIntro();
  const dc = e.target.closest("[data-dc]");
  if (dc){ state.destCountry = dc.dataset.dc || null; return render(); }
  const cf = e.target.closest("[data-cf]");
  if (cf){ state.candFilter = cf.dataset.cf; return render(); }
  const dd = e.target.closest("[data-dec]");
  if (dd) return decide(dd.dataset.log, dd.dataset.dec);
  if (e.target.id === "exportBtn") return exportApproved();
  const pl = e.target.closest("[data-place]"); if (pl) return openPlace(pl.dataset.place);
  const tr = e.target.closest("[data-trip]");  if (tr) return openTrip(tr.dataset.trip);
});
document.body.addEventListener("input", e => {
  if (e.target.id !== "gYear") return;
  cancelAnimationFrame(gIntro); gIntro = 0;      // 손으로 끌면 켜지던 연출은 그만둔다
  setGlobeYear(+e.target.value);
});
/* 밝은/어두운 테마가 바뀌면 홈을 다시 그린다 — 지구본과 투어는 그릴 때 색을 읽는다. */
matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => {
  if (state.view !== "home") return;
  const y = scrollY; render(); scrollTo({top:y});
});
document.querySelector("#panel .close").onclick = () =>
  document.getElementById("panel").classList.remove("open");
document.getElementById("menuBtn").onclick = () =>
  document.getElementById("aside").classList.toggle("open");
document.getElementById("search").addEventListener("keydown", e => {
  if (e.key === "Enter") runSearch(e.target.value);
});
addEventListener("keydown", e => {
  if (e.key === "Escape") document.getElementById("panel").classList.remove("open");
});

if (CANDS.length) document.getElementById('candTab').hidden = false;
renderAside();
render();

/* 일정표에서 돌아왔을 때(index.html?trip=…) 그 여정을 다시 펴 준다.
   일정표는 새 창이 아니라 이 창에서 열리므로, 돌아오면 보던 자리가 그대로 있어야 한다. */
{
  const back = new URLSearchParams(location.search).get("trip");
  const t = back && TRIPS.find(x => x.id === back);
  if (t){ state.year = Math.max(state.year, endYear(t)); go("timeline"); openTrip(t.id); }
}
</script>
